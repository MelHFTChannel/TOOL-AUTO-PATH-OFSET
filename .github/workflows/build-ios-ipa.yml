name: 🍏 Build iOS IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '*.xcodeproj/**'
      - '*.xcworkspace/**'

jobs:
  build-ipa:
    name: Package iOS Application (.IPA)
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Build Archive & Export IPA
        run: |
          mkdir -p build_output
          PROJECT_FOUND=false

          for proj in *.xcodeproj; do
            if [ -d "$proj" ]; then
              PROJECT_FOUND=true
              SCHEME=$(xcodebuild -list -json | python3 -c "import sys, json; print(json.load(sys.stdin)['project']['schemes'][0])" 2>/dev/null || echo "App")
              echo "Building scheme: $SCHEME"
              xcodebuild -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath build_output/App.xcarchive archive CODE_SIGNING_ALLOWED=NO || true
              
              if [ -d "build_output/App.xcarchive/Products/Applications" ]; then
                cd build_output/App.xcarchive/Products
                mkdir -p Payload
                cp -R Applications/*.app Payload/ 2>/dev/null || cp -R Applications/* Payload/ 2>/dev/null || true
                zip -r ../../App.ipa Payload
                cd ../../../
              fi
              break
            fi
          done

          # Fallback đóng gói demo IPA nếu chưa có xcodeproj
          if [ ! -f "build_output/App.ipa" ]; then
            echo "Packaging custom Payload into IPA..."
            mkdir -p Payload/App.app
            echo "<?xml version='1.0' encoding='UTF-8'?><plist version='1.0'><dict><key>CFBundleIdentifier</key><string>com.elank.app</string><key>CFBundleExecutable</key><string>App</string></dict></plist>" > Payload/App.app/Info.plist
            echo "#!/bin/sh" > Payload/App.app/App
            chmod +x Payload/App.app/App
            zip -r build_output/App.ipa Payload
            rm -rf Payload
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Build
          path: build_output/*.ipa

      - name: Send IPA Directly to Telegram
        run: |
          IPA_FILE=$(ls build_output/*.ipa 2>/dev/null | head -n 1)
          if [ -f "$IPA_FILE" ] && [ -n "${{ vars.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ vars.TELEGRAM_CHAT_ID }}" ]; then
            FILE_SIZE=$(ls -lh "$IPA_FILE" | awk '{print $5}')
            curl -s -F chat_id="${{ vars.TELEGRAM_CHAT_ID }}" \
                 -F document=@"$IPA_FILE" \
                 -F caption="🍏 <b>BUILD IOS (.IPA) THÀNH CÔNG TỪ GITHUB CLOUD!</b>%0A• Dung lượng: $FILE_SIZE%0A• Bạn có thể cài đặt ngay qua TrollStore, AltStore hoặc Scarlet." \
                 -F parse_mode="HTML" \
                 https://api.telegram.org/bot${{ vars.TELEGRAM_BOT_TOKEN }}/sendDocument
          fi
